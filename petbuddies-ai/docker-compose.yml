# Banco de desenvolvimento do serviço de cuidado.
#
# Só o MySQL sobe aqui — a aplicação roda no terminal (`mvn spring-boot:run`),
# onde o log fica visível e o restart é imediato.
#
#   docker compose up -d          sobe o banco
#   docker compose down -v        derruba e APAGA o volume
#
# O `-v` é o ciclo normal desta sprint: os bancos são resetados, não migrados
# (ADR s3-17), e o Flyway recria o schema inteiro a cada subida.
services:
  mysql:
    image: mysql:8.0
    # sem container_name fixo: duas worktrees em paralelo colidiriam no mesmo nome.
    # O compose nomeia por COMPOSE_PROJECT_NAME, que ja e proprio de cada agente.
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql}
      MYSQL_DATABASE: petbuddies_cuidado
      MYSQL_USER: ${MYSQL_USER:-petbuddies_cuidado}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-petbuddies}
    volumes:
      - mysql-cuidado:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-cuidado:
