# Execução local — o mesmo desenho que vai para a nuvem: a API e o banco.
#
#   ./scripts/02_build-push.sh   clona as duas APIs em .build/ (pré-requisito)
#   docker compose up -d --build
#   docker compose down -v       derruba e APAGA os volumes
#
# A imagem do Oracle é amd64 (gvenzl só publica essa arquitetura), então em Mac
# ARM ela roda emulada e sobe devagar. Na nuvem é nativo.
services:

  oracle:
    build: ./database
    container_name: petbuddies_oracle
    env_file: [.env]
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD}
      ORACLE_CHARACTERSET: AL32UTF8
      APP_USER: ${ORACLE_USER_CUIDADO}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD_CUIDADO}
    ports: ["1521:1521"]
    volumes:
      - oracle_dados:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s
    networks: [petbuddies-net]

  api-cuidado:
    build:
      context: ./petbuddies-ai
      dockerfile: Dockerfile.runtime
    container_name: petbuddies_java
    env_file: [.env]
    environment:
      ORACLE_URL: jdbc:oracle:thin:@oracle:1521/XEPDB1
      ORACLE_USER: ${ORACLE_USER_CUIDADO}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD_CUIDADO}
      PETBUDDIES_JWT_SECRET: ${PETBUDDIES_JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      oracle: { condition: service_healthy }
    ports: ["8080:8080"]
    networks: [petbuddies-net]

networks:
  petbuddies-net: { driver: bridge }

volumes:
  oracle_dados:
