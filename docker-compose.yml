# Execução local dos três componentes — o mesmo desenho que vai para a nuvem.
#
#   ./scripts/02_build-push.sh   clona as duas APIs em .build/ (pré-requisito)
#   docker compose up -d --build
#   docker compose down -v       derruba e APAGA os volumes
#
# A imagem do Oracle é amd64 (gvenzl só publica essa arquitetura), então em Mac
# ARM ela roda emulada e sobe devagar. Na nuvem é nativo.
services:

  oracle:
    build: ./oracle
    container_name: petbuddies_oracle
    env_file: [.env]
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD}
      ORACLE_CHARACTERSET: AL32UTF8
      APP_USER: ${ORACLE_USER_CUIDADO}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD_CUIDADO}
      APP_USER_2: ${ORACLE_USER_BACKOFFICE}
      APP_USER_2_PASSWORD: ${ORACLE_PASSWORD_BACKOFFICE}
    ports: ["1521:1521"]
    volumes:
      - oracle_dados:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s
    networks: [petbuddies-net]

  api-backoffice:
    build: ../PetBuddies-API/PetBuddies-API
    container_name: petbuddies_dotnet
    env_file: [.env]
    environment:
      ConnectionStrings__Oracle: "Data Source=(DESCRIPTION=(ADDRESS_LIST=(ADDRESS=(PROTOCOL=TCP)(HOST=oracle)(PORT=1521)))(CONNECT_DATA=(SERVER=DEDICATED)(SERVICE_NAME=XEPDB1)));User Id=${ORACLE_USER_BACKOFFICE};Password=${ORACLE_PASSWORD_BACKOFFICE};Max Pool Size=3;Min Pool Size=1"
      PETBUDDIES_JWT_SECRET: ${PETBUDDIES_JWT_SECRET}
      # O host é o nome do SERVIÇO na rede do compose — nem o nome da rede, nem
      # a porta publicada. Errar isso deixa a chamada entre os dois silenciosa.
      MotorApi__BaseUrl: http://api-cuidado:8080
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      oracle: { condition: service_healthy }
    ports: ["5297:8080"]
    networks: [petbuddies-net]

  api-cuidado:
    build: ../petbuddies-ai
    container_name: petbuddies_java
    env_file: [.env]
    environment:
      # PETNETAPI_URL vence o application-docker.properties: variável de ambiente
      # tem precedência sobre arquivo de profile no Spring.
      SPRING_PROFILES_ACTIVE: docker
      PETNETAPI_URL: http://api-backoffice:8080
      ORACLE_URL: jdbc:oracle:thin:@oracle:1521/XEPDB1
      ORACLE_USER: ${ORACLE_USER_CUIDADO}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD_CUIDADO}
      PETBUDDIES_JWT_SECRET: ${PETBUDDIES_JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      oracle: { condition: service_healthy }
    ports: ["8080:8080"]
    networks: [petbuddies-net]

networks:
  petbuddies-net: { driver: bridge }

volumes:
  oracle_dados:
