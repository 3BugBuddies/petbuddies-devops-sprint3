# Execução local — o mesmo desenho que vai para a nuvem: a API e o banco.
#
#   ./scripts/02_build-push.sh   clona as duas APIs em .build/ (pré-requisito)
#   docker compose up -d --build
#   docker compose down -v       derruba e APAGA os volumes
services:

  mysql:
    image: mysql:8.0
    container_name: petbuddies_mysql
    env_file: [.env]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: petbuddies_cuidado
      MYSQL_USER: ${MYSQL_USER_CUIDADO}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD_CUIDADO}
    ports: ["3306:3306"]
    volumes:
      - mysql_dados:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks: [petbuddies-net]

  api-cuidado:
    build:
      context: ./petbuddies-ai
      dockerfile: Dockerfile.runtime
    container_name: petbuddies_java
    env_file: [.env]
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/petbuddies_cuidado
      MYSQL_USER: ${MYSQL_USER_CUIDADO}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD_CUIDADO}
      PETBUDDIES_JWT_SECRET: ${PETBUDDIES_JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      mysql: { condition: service_healthy }
    ports: ["8080:8080"]
    networks: [petbuddies-net]

networks:
  petbuddies-net: { driver: bridge }

volumes:
  mysql_dados:
